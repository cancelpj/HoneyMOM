ntology/honeymom#Changeover", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Changeover", "http://www.w3.org/2000/01/rdf-schema#comment", "\"设备由前一产品切换到后一产品所需的准备时长。排产时在上一单产品不同时追加该时长,并产出「换型」提示。\""], ["https://example.org/ontology/honeymom#Changeover", "http://www.w3.org/2000/01/rdf-schema#label", "\"换型时间\""], ["https://example.org/ontology/honeymom#Consumable", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Consumable", "http://www.w3.org/2000/01/rdf-schema#comment", "\"物料类型取值之一:易耗品。如刀具、砂料等按消耗扣减的物料。\""], ["https://example.org/ontology/honeymom#Consumable", "http://www.w3.org/2000/01/rdf-schema#label", "\"易耗品\""], ["https://example.org/ontology/honeymom#Consumable", "http://www.w3.org/2000/01/rdf-schema#subClassOf", "https://example.org/ontology/honeymom#Material"], ["https://example.org/ontology/honeymom#Customer", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Customer", "http://www.w3.org/2000/01/rdf-schema#comment", "\"销售对象,带信用额度与结算方式;信用检查是销售订单状态流转的一环。\""], ["https://example.org/ontology/honeymom#Customer", "http://www.w3.org/2000/01/rdf-schema#label", "\"客户\""], ["https://example.org/ontology/honeymom#DataSource", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#DataSource", "http://www.w3.org/2000/01/rdf-schema#comment", "\"现场设备接入点,协议含 MQTT(UNS)、OPC UA、Modbus TCP。\""], ["https://example.org/ontology/honeymom#DataSource", "http://www.w3.org/2000/01/rdf-schema#label", "\"数据源\""], ["https://example.org/ontology/honeymom#DefectCode", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#DefectCode", "http://www.w3.org/2000/01/rdf-schema#comment", "\"缺陷字典,带类别(铸造/机加/外观/其他)与严重度(致命/严重/轻微),可绑定责任工序用于根因追溯。\""], ["https://example.org/ontology/honeymom#DefectCode", "http://www.w3.org/2000/01/rdf-schema#label", "\"缺陷代码\""], ["https://example.org/ontology/honeymom#DeliverySchedule", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#DeliverySchedule", "http://www.w3.org/2000/01/rdf-schema#comment", "\"订单行下的分批交货安排,交期是排产的时间锚点。\""], ["https://example.org/ontology/honeymom#DeliverySchedule", "http://www.w3.org/2000/01/rdf-schema#label", "\"交货计划\""], ["https://example.org/ontology/honeymom#DemandForecast", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#DemandForecast", "http://www.w3.org/2000/01/rdf-schema#comment", "\"物料在某日期的预测需求量,可关联客户。\""], ["https://example.org/ontology/honeymom#DemandForecast", "http://www.w3.org/2000/01/rdf-schema#label", "\"需求预测\""], ["https://example.org/ontology/honeymom#DowntimePlan", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#DowntimePlan", "http://www.w3.org/2000/01/rdf-schema#comment", "\"已登记的设备不可用时段(计划保养、维修、放假停产、试制调试),排产时作为硬约束。\""], ["https://example.org/ontology/honeymom#DowntimePlan", "http://www.w3.org/2000/01/rdf-schema#label", "\"设备停机计划\""], ["https://example.org/ontology/honeymom#Employee", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Employee", "http://www.w3.org/2000/01/rdf-schema#comment", "\"作业人员。能否操作某工序由 OperatorSkill 决定,不由岗位名称决定。\""], ["https://example.org/ontology/honeymom#Employee", "http://www.w3.org/2000/01/rdf-schema#label", "\"员工\""], ["https://example.org/ontology/honeymom#Equipment", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Equipment", "http://www.w3.org/2000/01/rdf-sche gy/honeymom#FirstArticleRelease", "http://www.w3.org/2002/07/owl#hasKey", "_:cb154e599d5b1aa1b0483b9543cb02dcbc38276c067c804c017fd0b6a1f985be022"], ["https://example.org/ontology/honeymom#Gauge", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Gauge", "http://www.w3.org/2000/01/rdf-schema#comment", "\"量具/检具台账。带校准到期状态:检验记录要求引用一把在有效期内的量具,过期量具不能用于出具有效检验结论。\""], ["https://example.org/ontology/honeymom#Gauge", "http://www.w3.org/2000/01/rdf-schema#label", "\"量检具\""], ["https://example.org/ontology/honeymom#GaugeCalibration", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#GaugeCalibration", "http://www.w3.org/2000/01/rdf-schema#comment", "\"量检具的一次校准,含校准日期、结果与到期日;到期后量具不可用于检验。\""], ["https://example.org/ontology/honeymom#GaugeCalibration", "http://www.w3.org/2000/01/rdf-schema#label", "\"校准记录\""], ["https://example.org/ontology/honeymom#InProcessInspection", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#InProcessInspection", "http://www.w3.org/2000/01/rdf-schema#comment", "\"检验类型取值之一:过程。生产过程中在检验点执行。\""], ["https://example.org/ontology/honeymom#InProcessInspection", "http://www.w3.org/2000/01/rdf-schema#label", "\"过程检验\""], ["https://example.org/ontology/honeymom#InProcessInspection", "http://www.w3.org/2000/01/rdf-schema#subClassOf", "https://example.org/ontology/honeymom#InspectionRecord"], ["https://example.org/ontology/honeymom#InProcessInspection", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#FinalInspection"], ["https://example.org/ontology/honeymom#InProcessInspection", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#FirstArticleInspection"], ["https://example.org/ontology/honeymom#InProcessInspection", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#PatrolInspection"], ["https://example.org/ontology/honeymom#IncomingInspection", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#IncomingInspection", "http://www.w3.org/2000/01/rdf-schema#comment", "\"检验类型取值之一:来料。对应采购收货时的进货检验。\""], ["https://example.org/ontology/honeymom#IncomingInspection", "http://www.w3.org/2000/01/rdf-schema#label", "\"来料检验\""], ["https://example.org/ontology/honeymom#IncomingInspection", "http://www.w3.org/2000/01/rdf-schema#subClassOf", "https://example.org/ontology/honeymom#InspectionRecord"], ["https://example.org/ontology/honeymom#IncomingInspection", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#FinalInspection"], ["https://example.org/ontology/honeymom#IncomingInspection", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#FirstArticleInspection"], ["https://example.org/ontology/honeymom#IncomingInspection", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#InProcessInspection"], ["https://example.org/ontology/honeymom#IncomingInspection", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#PatrolInspection"], ["https://example.org/ontology/honeymom#InspectionItem", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#InspectionItem", "http://www.w3.org/2000/01/rdf-schema#comment", "\"模板下的一条待检项:特性代码、量具类型、上下限、关键/特殊特性标记。首检放行的判定依据即这些项目的上下限。\""], ["https://example.org/ontology/honeymom#InspectionItem", "http://www.w3.org/2000/01/rdf-schema#label", "\"检验项目\""], ["https://example.org/ontology/honeymom#InspectionRecord", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#InspectionRecord", "http://www.w3.org/2000/01/rdf-schema#comment", "\"一次检验的执行结果,结论为合格/不合格/待判。检验类型为单值枚举,故其子类互斥。\""], ["https://example.org/ontology/honeymom#InspectionRecord", "http://www.w3.org/2000/01/rdf-schema#label", "\"检验记录\""], ["https://example.org/ontology/honeymom#InspectionTemplate", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#InspectionTemplate", "http://www.w3.org/2000/01/rdf-schema#comment", "\"检验的模板定义,按物料或工序适用,含抽样规则。模板下挂检验项目,项目带上下限与关键特性标记。\""], ["https://example.org/ontology/honeymom#InspectionTemplate", "http://www.w3.org/2000/01/rdf-schema#label", "\"检验模板\""], ["https://example.org/ontology/honeymom#InspectionValue", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#InspectionValue", "http://www.w3.org/2000/01/rdf-schema#comment", "\"单个检验项的实测值,绑定量具。合格判定按上下限,判定结论回写到检验记录。\""], ["https://example.org/ontology/honeymom#InspectionValue", "http://www.w3.org/2000/01/rdf-schema#label", "\"检验值\""], ["https://example.org/ontology/honeymom#KittingRecord", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#KittingRecord", "http://www.w3.org/2000/01/rdf-schema#comment", "\"工单各物料的齐套状态(齐套/部分/缺料)与预计到料时间。缺料工单在预计到料时间之后才能开工,这是排产的主要输入之一。\""], ["https://example.org/ontology/honeymom#KittingRecord", "http://www.w3.org/2000/01/rdf-schema#label", "\"物料齐套\""], ["https://example.org/ontology/honeymom#LotHold", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#LotHold", "http://www.w3.org/2000/01/rdf-schema#comment", "\"对某个批次(炉次)的冻结单。冻结期间:该批次零件禁止报工、禁止出库/移库;解冻时按冻结后的事件流恢复零件真实状态。\""], ["https://example.org/ontology/honeymom#LotHold", "http://www.w3.org/2000/01/rdf-schema#label", "\"批次冻结\""], ["https://example.org/ontology/honeymom#LotHold", "http://www.w3.org/2002/07/owl#hasKey", "_:cbfe59c6655a0e7f427a9c7516c9bcd62828ce1e7af7d74191b6ce6854efdfe159"], ["https://example.org/ontology/honeymom#MaintenancePlan", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#MaintenancePlan", "http://www.w3.org/2000/01/rdf-schema#comment", "\"点检/保养/润滑计划,带周期天数与下次到期日,指定负责人。\""], ["https://example.org/ontology/honeymom#MaintenancePlan", "http://www.w3.org/2000/01/rdf-schema#label", "\"点检保养计划\""], ["https://example.org/ontology/honeymom#MaintenanceRecord", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#MaintenanceRecord", "http://www.w3.org/2000/01/rdf-schema#comment", "\"计划的一次执行结果(正常/异常)。\""], ["https://example.org/ontology/honeymom#MaintenanceRecord", "http://www.w3.org/2000/01/rdf-schema#label", "\"点检保养记录\""], ["https://example.org/ontology/honeymom#Material", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Material", "http://www.w3.org/2000/01/rdf-schema#comment", "\"可被生产消耗或对外销售的对象,承载规格、单位、安全库存、单价、单重。物料类型(mtype)在系统中为单值枚举,故其子类互斥。\""], ["https://example.org/ontology/honeymom#Material", "http://www.w3.org/2000/01/rdf-schema#label", "\"物料\""], ["https://example.org/ontology/honeymom#MaterialIssue", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#MaterialIssue", "http://www.w3.org/2000/01/rdf-schema#comment", "\"工单领用或退回物料的流水,带批次维度。批次冻结期间,出库方向会被拦截。\""], ["https://example.org/ontology/honeymom#MaterialIssue", "http://www.w3.org/2000/01/rdf-schema#label", "\"领料退料\""], ["https://example.org/ontology/honeymom#MaterialPlan", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#MaterialPlan", "http://www.w3.org/2000/01/rdf-schema#comment", "\"物料的采购/制造属性:自制或外购、提前期、最小批量、批量倍数、安全库存、损耗率、默认供应商与默认仓库。MRP 运算按这些参数净算需求。\""], ["https://example.org/ontology/honeymom#MaterialPlan", "http://www.w3.org/2000/01/rdf-schema#label", "\"物料计划参数\""], ["https://example.org/ontology/honeymom#MaterialRequest", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#MaterialRequest", "http://www.w3.org/2000/01/rdf-schema#comment", "\"缺料时的请领单,挂在工单与仓库上。\""], ["https://example.org/ontology/honeymom#MaterialRequest", "http://www.w3.org/2000/01/rdf-schema#label", "\"物料申请\""], ["https://example.org/ontology/honeymom#MrpRun", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#MrpRun", "http://www.w3.org/2000/01/rdf-schema#comment", "\"一次物料需求计划运算,带计划期与运算状态;新运算取代旧运算。\""], ["https://example.org/ontology/honeymom#MrpRun", "http://www.w3.org/2000/01/rdf-schema#label", "\"MRP 运算\""], ["https://example.org/ontology/honeymom#MrpSuggestion", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#MrpSuggestion", "http://www.w3.org/2000/01/rdf-schema#comment", "\"MRP 净算后的建议(计划生产/计划采购/提前/推迟),带需求 pegging 溯源与产能检查结果。可下发为生产工单或采购订单。\""], ["https://example.org/ontology/honeymom#MrpSuggestion", "http://www.w3.org/2000/01/rdf-schema#label", "\"MRP 建议\""], ["https://example.org/ontology/honeymom#NonconformanceReport", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#NonconformanceReport", "http://www.w3.org/2000/01/rdf-schema#comment", "\"不合格品报告(NCR),带处置(待处置/返修/报废/让步接收/退供应商)与状态(待处理/评审中/已关闭)。首检不合格时自动登记 NCR 且不予放行。\""], ["https://example.org/ontology/honeymom#NonconformanceReport", "http://www.w3.org/2000/01/rdf-schema#label", "\"不合格品\""], ["https://example.org/ontology/honeymom#NonconformanceReport", "http://www.w3.org/2002/07/owl#hasKey", "_:cb124df8bf6efeae1908aa2d53fa9f29e183079ce8a30ff833bdb9bf1c18cf7a99a"], ["https://example.org/ontology/honeymom#OperatorSkill", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#OperatorSkill", "http://www.w3.org/2000/01/rdf-schema#comment", "\"员工在某工序/工位组上的技能等级(学徒/熟练/骨干/可带教),带有效期。排产时若某工序在某个班次内没有合格操作工,产出约束标记「无合格操作工」。\""], ["https://example.org/ontology/honeymom#OperatorSkill", "http://www.w3.org/2000/01/rdf-schema#label", "\"人员技能\""], ["https://example.org/ontology/honeymom#Part", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Part", "http://www.w3.org/2000/01/rdf-schema#comment", "\"\"\"一件一码的实物追踪对象。状态流转:毛坯库 → 在制 → 检验合格 → 成品入库 → 已发运,旁路有返修中、冻结、报废。\n铸造场景下携带炉次、浇包、砂型、型腔、浇注温度、残镁、型砂水分等追溯参数;机加场景下携带加工机床。\"\"\""], ["https://example.org/ontology/honeymom#Part", "http://www.w3.org/2000/01/rdf-schema#label", "\"在制品\""], ["https://example.org/ontology/honeymom#PartEvent", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#PartEvent", "http://www.w3.org/2000/01/rdf-schema#comment", "\"零件在现场的时序事件流(流转、检验、冻结等),与 Part 一对多,按时间回放可重建当前状态。\""], ["https://example.org/ontology/honeymom#PartEvent", "http://www.w3.org/2000/01/rdf-schema#label", "\"零件事件\""], ["https://example.org/ontology/honeymom#PatrolInspection", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#PatrolInspection", "http://www.w3.org/2000/01/rdf-schema#comment", "\"检验类型取值之一:巡检。班中周期性抽查。\""], ["https://example.org/ontology/honeymom#PatrolInspection", "http://www.w3.org/2000/01/rdf-schema#label", "\"巡检\""], ["https://example.org/ontology/honeymom#PatrolInspection", "http://www.w3.org/2000/01/rdf-schema#subClassOf", "https://example.org/ontology/honeymom#InspectionRecord"], ["https://example.org/ontology/honeymom#Plant", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Plant", "http://www.w3.org/2000/01/rdf-schema#comment", "\"制造实体,是车间与销售订单/采购订单的收货与发货主体。\""], ["https://example.org/ontology/honeymom#Plant", "http://www.w3.org/2000/01/rdf-schema#label", "\"工厂\""], ["https://example.org/ontology/honeymom#Process", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Process", "http://www.w3.org/2000/01/rdf-schema#comment", "\"可被排产与报工的最小制造步骤(如熔炼、造型浇注、机加工)。工序带标准节拍,是 OEE 性能率与排产时长的计算基准。\""], ["https://example.org/ontology/honeymom#Process", "http://www.w3.org/2000/01/rdf-schema#label", "\"工序\""], ["https://example.org/ontology/honeymom#ProductionLine", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#ProductionLine", "http://www.w3.org/2000/01/rdf-schema#comment", "\"车间下的连续生产单元,工位与设备挂靠其上;工单可在产线上排产。\""], ["https://example.org/ontology/honeymom#ProductionLine", "http://www.w3.org/2000/01/rdf-schema#label", "\"产线\""], ["https://example.org/ontology/honeymom#ProductionReport", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#ProductionReport", "http://www.w3.org/2000/01/rdf-schema#comment", "\"\"\"现场产出记录,来源含设备自动、人工、手机扫码、扫码枪、工位终端。系统实际执行的放行闸门( services/gates.py submit_report )依次为:\n(1) 幂等键 idem_key 重复提交 → 识别为重复提交,不重复计数;\n(2) 零件所属批次处于冻结中 → 阻断;\n(3) 本次合格数+不良数必须大于 0;\n(4) 不得超过上道工序转来的合格数减去本道已报数(跳序/超量);\n(5) 不得超过工序计划量 ×(1+report_over_pct/100)(超计划);\n(6) 工序标记首检放行时,须已首检放行;\n(7) ECN 停工中的工单 → 阻断。\n以上为运行时规则,本体仅记录其语义,不以 OWL 公理表达为可执行约束。\"\"\""], ["https://example.org/ontology/honeymom#ProductionReport", "http://www.w3.org/2000/01/rdf-schema#label", "\"报工记录\""], ["https://example.org/ontology/honeymom#PurchaseOrder", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#PurchaseOrder", "http://www.w3.org/2000/01/rdf-schema#comment", "\"对供应商的采购承诺,收货时转入库并触发来料检验。\""], ["https://example.org/ontology/honeymom#PurchaseOrder", "http://www.w3.org/2000/01/rdf-schema#label", "\"采购订单\""], ["https://example.org/ontology/honeymom#PurchaseOrderLine", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#PurchaseOrderLine", "http://www.w3.org/2000/01/rdf-schema#comment", "\"采购明细,带已收/合格入库/不合格数量,不合格部分可退供。\""], ["https://example.org/ontology/honeymom#PurchaseOrderLine", "http://www.w3.org/2000/01/rdf-schema#label", "\"采购订单行\""], ["https://example.org/ontology/honeymom#PurchaseRequisition", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#PurchaseRequisition", "http://www.w3.org/2000/01/rdf-schema#comment", "\"采购需求,可由 MRP 建议生成。\""], ["https://example.org/ontology/honeymom#PurchaseRequisition", "http://www.w3.org/2000/01/rdf-schema#label", "\"请购单\""], ["https://example.org/ontology/honeymom#Quotation", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Quotation", "http://www.w3.org/2000/01/rdf-schema#comment", "\"对外报价,可转为销售订单。\""], ["https://example.org/ontology/honeymom#Quotation", "http://www.w3.org/2000/01/rdf-schema#label", "\"报价单\""], ["https://example.org/ontology/honeymom#RawMaterial", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#RawMaterial", "http://www.w3.org/2000/01/rdf-schema#comment", "\"物料类型取值之一:原材料。与其他物料类型子类互斥(mtype 单值枚举)。\""], ["https://example.org/ontology/honeymom#RawMaterial", "http://www.w3.org/2000/01/rdf-schema#label", "\"原材料\""], ["https://example.org/ontology/honeymom#RawMaterial", "http://www.w3.org/2000/01/rdf-schema#subClassOf", "https://example.org/ontology/honeymom#Material"], ["https://example.org/ontology/honeymom#RawMaterial", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#AuxiliaryMaterial"], ["https://example.org/ontology/honeymom#RawMaterial", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#Consumable"], ["https://example.org/ontology/honeymom#RawMaterial", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#FinishedProduct"], ["https://example.org/ontology/honeymom#RawMaterial", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#SemiFinishedMaterial"], ["https://example.org/ontology/honeymom#RepairOrder", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#RepairOrder", "http://www.w3.org/2000/01/rdf-schema#comment", "\"维修工单,状态:已报修 → 已派工 → 维修中 → 已修复 → 已验收。未修复完成的工单所涉设备在排产时视为不可用。\""], ["https://example.org/ontology/honeymom#RepairOrder", "http://www.w3.org/2000/01/rdf-schema#label", "\"维修工单\""], ["https://example.org/ontology/honeymom#ReworkOrder", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#ReworkOrder", "http://www.w3.org/2000/01/rdf-schema#comment", "\"返修单,必须处于「进行中」才能流转结果;返修完成后须复检(引用一条检验记录)并给出复检结论,复检不合格则返修不合格。\""], ["https://example.org/ontology/honeymom#ReworkOrder", "http://www.w3.org/2000/01/rdf-schema#label", "\"返修记录\""], ["https://example.org/ontology/honeymom#Routing", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Routing", "http://www.w3.org/2000/01/rdf-schema#comment", "\"产品的工艺版本,带生效/作废状态;一条路线由若干有序工艺步骤构成,工单下达时冻结引用某一版本。\""], ["https://example.org/ontology/honeymom#Routing", "http://www.w3.org/2000/01/rdf-schema#label", "\"工艺路线\""], ["https://example.org/ontology/honeymom#RoutingStep", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#RoutingStep", "http://www.w3.org/2000/01/rdf-schema#comment", "\"工艺路线上的一道工序。携带决定现场行为的三个开关:是否检验点、是否首检放行、报工方式(设备自动/人工/扫码);并指定工位组与标准节拍。\""], ["https://example.org/ontology/honeymom#RoutingStep", "http://www.w3.org/2000/01/rdf-schema#label", "\"工艺步骤\""], ["https://example.org/ontology/honeymom#SalesOrder", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#SalesOrder", "http://www.w3.org/2000/01/rdf-schema#comment", "\"客户订单。状态:草稿 → 信用待批 → 已确认 → 部分发货 → 已发完 → 已关闭。按单生产(mto)时,订单行会派生生产工单。\""], ["https://example.org/ontology/honeymom#SalesOrder", "http://www.w3.org/2000/01/rdf-schema#label", "\"销售订单\""], ["https://example.org/ontology/honeymom#SalesOrderLine", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#SalesOrderLine", "http://www.w3.org/2000/01/rdf-schema#comment", "\"订单的产品明细行,带数量、单价、交期与已发/已退数量;按单生产时关联到具体工单。\""], ["https://example.org/ontology/honeymom#SalesOrderLine", "http://www.w3.org/2000/01/rdf-schema#label", "\"销售订单行\""], ["https://example.org/ontology/honeymom#ScheduleProposal", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#ScheduleProposal", "http://www.w3.org/2000/01/rdf-schema#comment", "\"what-if 排产假设(设备停机、到料推迟、模具保养、优先级调整)落成的建议,带受影响工单与原因。采纳后写入主数据并重排。\""], ["https://example.org/ontology/honeymom#ScheduleProposal", "http://www.w3.org/2000/01/rdf-schema#label", "\"排程调整建议\""], ["https://example.org/ontology/honeymom#SemiFinishedMaterial", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#SemiFinishedMaterial", "http://www.w3.org/2000/01/rdf-schema#comment", "\"物料类型取值之一:半成品。经一道或多道工序加工后进入下一工序的中间件。\""], ["https://example.org/ontology/honeymom#SemiFinishedMaterial", "http://www.w3.org/2000/01/rdf-schema#label", "\"半成品\""], ["https://example.org/ontology/honeymom#SemiFinishedMaterial", "http://www.w3.org/2000/01/rdf-schema#subClassOf", "https://example.org/ontology/honeymom#Material"], ["https://example.org/ontology/honeymom#SemiFinishedMaterial", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#AuxiliaryMaterial"], ["https://example.org/ontology/honeymom#SemiFinishedMaterial", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#Consumable"], ["https://example.org/ontology/honeymom#SemiFinishedMaterial", "http://www.w3.org/2002/07/owl#disjointWith", "https://example.org/ontology/honeymom#FinishedProduct"], ["https://example.org/ontology/honeymom#Shift", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Shift", "http://www.w3.org/2000/01/rdf-schema#comment", "\"排产与考勤使用的时间段。active=false 的班次不参与排产,设备只在启用班次内工作。\""], ["https://example.org/ontology/honeymom#Shift", "http://www.w3.org/2000/01/rdf-schema#label", "\"班次\""], ["https://example.org/ontology/honeymom#Shipment", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Shipment", "http://www.w3.org/2000/01/rdf-schema#comment", "\"成品发运,对应工单与客户。\""], ["https://example.org/ontology/honeymom#Shipment", "http://www.w3.org/2000/01/rdf-schema#label", "\"发运记录\""], ["https://example.org/ontology/honeymom#Stock", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Stock", "http://www.w3.org/2000/01/rdf-schema#comment", "\"物料在仓库/库位上的当前数量,按批次(lot)分列。冻结批次仍占用库存,但不可出库。\""], ["https://example.org/ontology/honeymom#Stock", "http://www.w3.org/2000/01/rdf-schema#label", "\"库存\""], ["https://example.org/ontology/honeymom#StockTransaction", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#StockTransaction", "http://www.w3.org/2000/01/rdf-schema#comment", "\"库存流水:入库/出库/移库/盘点调整。移库含调入仓库。出库与移库方向受批次冻结拦截。\""], ["https://example.org/ontology/honeymom#StockTransaction", "http://www.w3.org/2000/01/rdf-schema#label", "\"出入库记录\""], ["https://example.org/ontology/honeymom#StorageLocation", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#StorageLocation", "http://www.w3.org/2000/01/rdf-schema#comment", "\"仓库内的库位,带容量。库存精确到库位。\""], ["https://example.org/ontology/honeymom#StorageLocation", "http://www.w3.org/2000/01/rdf-schema#label", "\"库位\""], ["https://example.org/ontology/honeymom#Supplier", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Supplier", "http://www.w3.org/2000/01/rdf-schema#comment", "\"供货方,带资格(合格/试用/停用)与绩效得分;停用供应商不能下采购订单。\""], ["https://example.org/ontology/honeymom#Supplier", "http://www.w3.org/2000/01/rdf-schema#label", "\"供应商\""], ["https://example.org/ontology/honeymom#TagPoint", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#TagPoint", "http://www.w3.org/2000/01/rdf-schema#comment", "\"设备点位定义,带地址、类型、量程缩放、采集周期与报警上下限。用途(运行状态/报警/功率/产量/主轴负载/温度/质量值)决定该点位被映射成哪类业务记录;接入时逐点确认语义,确认前不可投产。\""], ["https://example.org/ontology/honeymom#TagPoint", "http://www.w3.org/2000/01/rdf-schema#label", "\"采集点\""], ["https://example.org/ontology/honeymom#Team", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", "http://www.w3.org/2002/07/owl#Class"], ["https://example.org/ontology/honeymom#Team", "http://www.w3.org/2000/01/rdf-schema#comment", "\"人员的组织单元,归属某个班次,班组长是排产技能覆盖判断的组织边界。\""], ["https://example.org/ontology/honeymom#Team", "http://www.w3.org/2000/01/rdf-schema#label", "\"班组\""], ["https://example.org/ontology/honeymom#Tooling", "http://www.w3.org/1999/02/22-rdf-syntax-ns#type", ://www.w3.org/1999/02/22-rdf-syntax-ns#rest", "http://www.w3.org/1999/02/22-rdf-syntax-ns#nil"], ["_:cbfe59c6655a0e7f427a9c7516c9bcd62828ce1e7af7d74191b6ce6854efdfe159", "http://www.w3.org/1999/02/22-rdf-syntax-ns#first", "https://example.org/ontology/honeymom#lotHoldCode"], ["_:cbfe59c6655a0e7f427a9c7516c9bcd62828ce1e7af7d74191b6ce6854efdfe159", "http://www.w3.org/1999/02/22-rdf-syntax-ns#rest", "http://www.w3.org/1999/02/22-rdf-syntax-ns#nil"]], "warnings": [], "validation": "Turtle 解析及基础结构检查通过；未运行 OWL profile 检查、推理器或 Foundry 导入。"}</script>
<script>
"use strict";
const model = JSON.parse(document.getElementById("ontology-data").textContent);
const byId = new Map(model.nodes.map(node => [node.id, node]));
const $ = id => document.getElementById(id);
const text = (tag, value, className) => { const el = document.createElement(tag); el.textContent = value; if (className) el.className = className; return el; };
const link = id => { const el = text("button", byId.get(id)?.label || id); el.title = id; el.onclick = () => select(id); return el; };
const index = model.nodes.filter(node => !node.literal && (node.kinds[0] !== "资源" || model.triples.some(row => row[0] === node.id)));
const searchable = new Map(model.nodes.map(node => [node.id, [node.id,node.label,node.short].join(" ").toLowerCase()]));
for (const [subject, predicate, object] of model.triples) {
  searchable.set(subject, (searchable.get(subject) || "") + " " + (searchable.get(predicate) || predicate) + " " + (byId.get(object)?.label || object).toLowerCase());
}
let selected = null, query = "", kind = "", page = 0, zoom = 1, panX = 0, panY = 0;
const pageSize = 50;
const svgNS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs = {}) => { const el = document.createElementNS(svgNS, tag); for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
$("title").textContent = model.title;
document.title = model.title + " · 本体浏览器";
$("summary").textContent = model.ontologies.join(" · ");
$("validation").textContent = model.validation;
for (const [key, label] of [["classes","类"],["objectProperties","对象属性"],["dataProperties","数据属性"],["individuals","实例"],["triples","三元组"]]) {
  const item = text("div", "", "stat"); item.append(text("strong",model.counts[key]),text("span",label)); $("stats").append(item);
}
if (model.warnings.length) {
  $("warning-box").hidden = false; $("warning-title").textContent = model.warnings.length + " 条检查提示";
  for (const warning of model.warnings) $("warnings").append(text("li", warning));
}
$("provenance").textContent = "数据来源：" + model.source + " · SHA-256：" + model.sha256 + " · 独立离线视图；未加载外部本体或执行推理。";
function select(id) {
  const node = byId.get(id); if (!node) return;
  selected = id; $("details").replaceChildren(text("h2", node.label),text("code", node.id),text("p",node.kinds.join(" / "),"muted"));
  const dl = document.createElement("dl");
  for (const [s,p,o] of model.triples.filter(row => row[0] === id || row[2] === id)) {
    const incoming = s !== id; dl.append(text("dt", (incoming ? "← " : "") + (byId.get(p)?.short || p)));
    const dd = document.createElement("dd"); dd.append(link(incoming ? s : o)); dl.append(dd);
  }
  $("details").append(dl); renderEntities();
  for (const el of $("viewport").querySelectorAll(".graph-node")) el.classList.toggle("selected", el.dataset.id === id);
}
function renderEntities() {
  const matches = index.filter(node => (!kind || node.kinds.includes(kind)) && (!query || searchable.get(node.id).includes(query)));
  $("entities").replaceChildren(); $("entity-count").textContent = matches.length + " / " + index.length + " 个实体";
  for (const node of matches) {
    const button = link(node.id); button.append(text("span", node.kinds.join(" / "),"tag")); button.classList.toggle("active",node.id === selected); $("entities").append(button);
  }
  if (!matches.length) $("entities").append(text("p","没有匹配的实体。","muted"));
}
function renderTriples() {
  const rows = model.triples.filter(row => !query || row.some(id => (byId.get(id)?.label + " " + id).toLowerCase().includes(query)));
  const pages = Math.max(1,Math.ceil(rows.length/pageSize)); page = Math.min(page,pages-1);
  $("triples").replaceChildren();
  for (const row of rows.slice(page*pageSize,(page+1)*pageSize)) {
    const tr = document.createElement("tr"); for (const id of row) { const td = document.createElement("td"); const button = link(id); button.textContent = byId.get(id)?.short || id; td.append(button); tr.append(td); } $("triples").append(tr);
  }
  $("triple-count").textContent = rows.length + " / " + model.triples.length + " 条；搜索筛选全部页，不受实体类型筛选影响";
  $("page").textContent = (page+1) + " / " + pages + " 页 · 每页 " + pageSize + " 条";
  $("prev").disabled = page === 0; $("next").disabled = page >= pages-1;
}
function transform() { $("viewport").setAttribute("transform",`translate(${450+panX} ${270+panY}) scale(${zoom}) translate(-450 -270)`); }
function renderGraph() {
  const nodes = model.nodes.filter(node => node.kinds.includes("类") && !node.id.startsWith("_:"));
  const positions = new Map();
  nodes.forEach((node,i) => { const angle = (2*Math.PI*i/Math.max(1,nodes.length))-Math.PI/2; positions.set(node.id,{x:450+(nodes.length>1?290:0)*Math.cos(angle),y:270+(nodes.length>1?175:0)*Math.sin(angle)}); });
  const viewport = $("viewport"); viewport.replaceChildren();
  const lanes = new Map();
  for (const edge of model.edges) { const pair = JSON.stringify([edge.source,edge.target].sort()); if (!lanes.has(pair)) lanes.set(pair,[]); lanes.get(pair).push(edge); }
  model.edges.forEach(edge => {
    const from = positions.get(edge.source), to = positions.get(edge.target); if (!from || !to) return;
    const dx = to.x-from.x, dy = to.y-from.y, length = Math.hypot(dx,dy) || 1;
    const endX = to.x-dx/length*80, endY = to.y-dy/length*28;
    const self = edge.source === edge.target;
    const peers = lanes.get(JSON.stringify([edge.source,edge.target].sort()));
    const lane = peers.indexOf(edge)-(peers.length-1)/2;
    const bend = lane*64*(edge.source<edge.target?1:-1);
    const path = svgEl("path",{d:self?`M${from.x+45},${from.y-24} C${from.x+165},${from.y-125} ${from.x-165},${from.y-125} ${from.x-45},${from.y-24}`:`M${from.x},${from.y} Q${(from.x+to.x)/2-dy/length*bend},${(from.y+to.y)/2+dx/length*bend} ${endX},${endY}`,class:"edge","marker-end":"url(#arrow)"});
    const title = svgEl("title"); title.textContent = edge.label + " · " + edge.property; path.append(title); viewport.append(path);
    const label = svgEl("text",{x:self?from.x:(from.x+to.x)/2-dy/length*bend/2,y:self?from.y-94:(from.y+to.y)/2+dx/length*bend/2-7,class:"edge-label","text-anchor":"middle"}); label.textContent = edge.label; viewport.append(label);
  });
  for (const node of nodes) {
    const pos = positions.get(node.id); const g = svgEl("g",{class:"graph-node",transform:`translate(${pos.x} ${pos.y})`,tabindex:0,role:"button","aria-label":node.label}); g.dataset.id = node.id;
    g.append(svgEl("rect",{x:-78,y:-24,width:156,height:48,rx:9})); const label = svgEl("text",{"text-anchor":"middle",y:5}); label.textContent = node.label.length>16?node.label.slice(0,15)+"…":node.label; g.append(label);
    const title = svgEl("title"); title.textContent = node.label + "\n" + node.id; g.append(title); g.onclick = () => select(node.id); g.onkeydown = event => { if (["Enter"," "].includes(event.key)) { event.preventDefault(); select(node.id); } }; viewport.append(g);
  }
  if (!nodes.length) { const empty = svgEl("text",{x:450,y:270,"text-anchor":"middle"}); empty.textContent="没有可投影的命名类，请通过实体索引查看模型。"; viewport.append(empty); }
  $("graph-count").textContent = nodes.length + " 个命名类 · " + model.edges.length + " 条投影边"; transform();
}
$("search").oninput = event => { query = event.target.value.toLowerCase().trim(); page=0; renderEntities(); renderTriples(); };
$("kind").onchange = event => { kind = event.target.value; renderEntities(); };
$("prev").onclick = () => { page--; renderTriples(); }; $("next").onclick = () => { page++; renderTriples(); };
$("zoom-in").onclick = () => { zoom = Math.min(5,zoom*1.25); transform(); }; $("zoom-out").onclick = () => { zoom = Math.max(.2,zoom/1.25); transform(); };
$("reset").onclick = () => { zoom=1; panX=0; panY=0; transform(); };
let drag = null;
$("graph").addEventListener("pointerdown",event => { if (event.target.closest(".graph-node")) return; drag={x:event.clientX,y:event.clientY,panX,panY}; $("graph").setPointerCapture(event.pointerId); });
$("graph").addEventListener("pointermove",event => { if (!drag) return; const scale=900/$("graph").getBoundingClientRect().width; panX=drag.panX+(event.clientX-drag.x)*scale; panY=drag.panY+(event.clientY-drag.y)*scale; transform(); });
$("graph").addEventListener("pointerup",() => { drag=null; }); $("graph").addEventListener("pointercancel",() => { drag=null; });
renderEntities(); renderTriples(); renderGraph();
const first = index.find(node => node.kinds.includes("本体")); if (first) select(first.id);
</script>
</body>
